<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>开学小助手</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #dbdbdb;
    --text: #262626;
    --text-secondary: #8e8e8e;
    --accent: #0095f6;
    --danger: #ed4956;
    --online: #31c251;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #e4e4e4;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: stretch;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .app {
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    height: 100vh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  @media (min-width: 480px) {
    .app { box-shadow: 0 0 40px rgba(0,0,0,.18); }
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 5;
  }
  .icon-btn {
    width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--text);
    font-size: 20px;
    flex-shrink: 0;
  }
  .icon-btn:active { background: #f0f0f0; }
  .icon-btn svg { width: 22px; height: 22px; display: block; }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
    flex-shrink: 0;
  }
  .avatar.small { width: 30px; height: 30px; font-size: 13px; }

  .top-info { flex: 1; min-width: 0; }
  .top-name { font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-status { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); display: inline-block; }

  /* ---------- Chat area ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
    padding: 14px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .msg-row { display: flex; gap: 8px; align-items: flex-start; animation: msgIn .18s ease-out; }
  .msg-row .avatar.small { margin-top: 2px; }
  .msg-body { max-width: 78%; display: flex; flex-direction: column; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.user .msg-body { align-items: flex-end; }

  .bubble {
    padding: 9px 14px;
    font-size: 14.5px;
    line-height: 1.45;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .bubble.bot {
    background: var(--surface);
    border: 1px solid #efefef;
    border-radius: 20px 20px 20px 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    color: var(--text);
  }
  .bubble.user {
    background: var(--accent);
    color: #fff;
    border-radius: 20px 20px 6px 20px;
  }
  .bubble.error {
    background: #fdecec;
    border-color: #f5c6cb;
    color: #c0392b;
    border-radius: 20px 20px 20px 6px;
  }
  .meta { font-size: 10.5px; color: var(--text-secondary); margin-top: 3px; padding: 0 2px; }

  /* typing indicator */
  .bubble.typing { display: inline-flex; align-items: center; gap: 4px; padding: 13px 16px; min-height: 20px; }
  .bubble.typing .tdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #b9b9b9;
    animation: blink 1.2s infinite;
  }
  .bubble.typing .tdot:nth-child(2) { animation-delay: .18s; }
  .bubble.typing .tdot:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,60%,100% { opacity:.35; transform: translateY(0); } 30% { opacity:1; transform: translateY(-2px); } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .retry-btn {
    align-self: flex-start;
    margin: 6px 0 0 0;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 16px;
    background: var(--surface);
  }
  .retry-btn:active { background: #e8f4ff; }

  /* ---------- Quick chips ---------- */
  .quick-wrap {
    background: var(--bg);
    padding: 4px 12px 8px;
    flex-shrink: 0;
    border-top: 1px solid #efefef;
  }
  .quick-title { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; padding-left: 2px; }
  .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--text);
    transition: background .15s;
  }
  .chip:active { background: #f0f0f0; }
  .chip:disabled { opacity: .5; }

  /* ---------- Input bar ---------- */
  .inputbar {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 8px 10px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-shell {
    flex: 1;
    display: flex;
    align-items: center;
    background: #efefef;
    border-radius: 22px;
    padding: 2px 4px 2px 14px;
    min-height: 40px;
  }
  .input-shell input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-size: 14.5px;
    color: var(--text);
    padding: 8px 0;
    min-width: 0;
  }
  .input-shell input::placeholder { color: #9a9a9a; }
  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-left: 4px;
  }
  .send-btn svg { width: 18px; height: 18px; }
  .send-btn:disabled { background: #b3dafb; cursor: default; }

  /* ---------- Menu sheet ---------- */
  .sheet-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s ease;
    z-index: 20;
  }
  .sheet-mask.show { opacity: 1; visibility: visible; }
  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%) translateY(100%);
    width: 100%;
    max-width: 430px;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    z-index: 21;
    transition: transform .25s ease;
    box-shadow: 0 -6px 30px rgba(0,0,0,.15);
  }
  .sheet.show { transform: translateX(-50%) translateY(0); }
  .sheet-grabber { width: 38px; height: 4px; border-radius: 2px; background: #d8d8d8; margin: 10px auto 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; }
  .sheet-head h2 { font-size: 16px; font-weight: 600; }
  .sheet-close { font-size: 22px; color: var(--text-secondary); width: 34px; height: 34px; }
  .sheet-body { padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); }
  .btn-danger {
    width: 100%;
    color: var(--danger);
    font-size: 14px;
    font-weight: 600;
    padding: 13px 12px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid #f3d3d6;
  }
  .btn-danger:active { background: #fdecec; }
  .sheet-hint { font-size: 11.5px; color: var(--text-secondary); margin-top: 14px; line-height: 1.6; text-align: center; }

  .toast {
    position: fixed; left: 50%; bottom: 90px;
    transform: translateX(-50%);
    background: rgba(38,38,38,.92);
    color: #fff;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 20px;
    z-index: 30;
    opacity: 0;
    transition: opacity .2s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="返回" title="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="avatar">校</div>
      <div class="top-info">
        <div class="top-name" id="topName">开学小助手</div>
        <div class="top-status"><span class="status-dot"></span>在线 · 随时解答</div>
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="菜单" title="菜单">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
      </button>
    </header>

    <main class="chat" id="chat"></main>

    <div class="quick-wrap" id="quickWrap" hidden>
      <div class="quick-title">试试这样问 👇</div>
      <div class="quick-chips" id="quickChips"></div>
    </div>

    <footer class="inputbar">
      <button class="icon-btn" id="emojiBtn" aria-label="表情" title="表情">😊</button>
      <div class="input-shell">
        <input id="input" placeholder="发消息…" autocomplete="off" enterkeyhint="send">
        <button class="icon-btn" id="cameraBtn" aria-label="相机" title="相机">📷</button>
      </div>
      <button class="send-btn" id="sendBtn" aria-label="发送" title="发送">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.5c.8-.35.8-1.5 0-1.85L3.4 3.6c-.65-.3-1.4.2-1.4.9v5.3c0 .5.37.92.86.99L15 12l-12.14 1.21c-.49.07-.86.5-.86.99v5.3c0 .7.75 1.2 1.4.9z"/></svg>
      </button>
    </footer>
  </div>

  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h2>菜单</h2>
      <button class="sheet-close" id="closeSheet" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body">
      <button class="btn-danger" id="clearChatBtn">清空聊天记录</button>
      <p class="sheet-hint">聊天记录只保存在你自己的浏览器里，清空后无法恢复。</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var LS_HISTORY = 'chat.history.v1';
  var MAX_CONTEXT = 20;

  var DEFAULT_BOT_NAME = '开学小助手';
  var DEFAULT_WELCOME = '你好呀！我是开学小助手 🎓\n关于新生报到、宿舍、缴费、军训、食堂等开学问题，都可以直接问我～';
  var DEFAULT_QUICK = [
    '报到流程是怎样的？',
    '宿舍怎么安排？',
    '学费怎么交？',
    '军训什么时候开始？',
    '食堂情况怎么样？'
  ];

  /* ---------- elements ---------- */
  var chatEl = document.getElementById('chat');
  var topNameEl = document.getElementById('topName');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var quickWrap = document.getElementById('quickWrap');
  var quickChips = document.getElementById('quickChips');
  var sheetMask = document.getElementById('sheetMask');
  var sheet = document.getElementById('sheet');
  var toastEl = document.getElementById('toast');

  var botName = DEFAULT_BOT_NAME;
  var welcome = DEFAULT_WELCOME;
  var quickQuestions = DEFAULT_QUICK;
  var historyArr = null;
  var streaming = false;
  var pendingRetry = null; // { messages: [...] }

  /* ---------- storage ---------- */
  function loadHistory() {
    try {
      var raw = localStorage.getItem(LS_HISTORY);
      var arr = raw ? JSON.parse(raw) : null;
      return Array.isArray(arr) ? arr : null;
    } catch (e) { return null; }
  }
  function saveHistory() {
    try { localStorage.setItem(LS_HISTORY, JSON.stringify(historyArr)); } catch (e) {}
  }

  /* ---------- utils ---------- */
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'm-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(ts) {
    var d = new Date(ts);
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var t = new Date();
    var same = d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
    return same ? hm : (pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm);
  }
  function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  /* ---------- rendering ---------- */
  function avatarEl(small) {
    var a = document.createElement('div');
    a.className = small ? 'avatar small' : 'avatar';
    a.textContent = '校';
    return a;
  }

  function appendMessage(msg) {
    var row = document.createElement('div');
    row.className = 'msg-row ' + (msg.role === 'user' ? 'user' : 'bot');
    if (msg.role !== 'user') row.appendChild(avatarEl(true));

    var body = document.createElement('div');
    body.className = 'msg-body';

    var bubble = document.createElement('div');
    bubble.className = 'bubble ' + (msg.role === 'user' ? 'user' : 'bot');
    bubble.textContent = msg.content;
    body.appendChild(bubble);

    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = fmtTime(msg.ts || Date.now());
    body.appendChild(meta);

    row.appendChild(body);
    chatEl.appendChild(row);
    scrollBottom();
  }

  function renderAll() {
    topNameEl.textContent = botName;
    chatEl.innerHTML = '';
    historyArr.forEach(appendMessage);
    updateQuickWrap();
    scrollBottom();
  }

  function updateQuickWrap() {
    var hasUserMsg = historyArr.some(function (m) { return m.role === 'user'; });
    quickWrap.hidden = hasUserMsg || streaming;
    if (quickWrap.hidden) return;
    quickChips.innerHTML = '';
    quickQuestions.forEach(function (q) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.textContent = q;
      b.disabled = streaming;
      b.addEventListener('click', function () { sendMessage(q); });
      quickChips.appendChild(b);
    });
  }

  /* ---------- typing / streaming DOM ---------- */
  function addTypingRow() {
    var row = document.createElement('div');
    row.className = 'msg-row bot typing-row';
    row.appendChild(avatarEl(true));
    var body = document.createElement('div');
    body.className = 'msg-body';
    var bubble = document.createElement('div');
    bubble.className = 'bubble bot typing';
    for (var i = 0; i < 3; i++) {
      var dot = document.createElement('span');
      dot.className = 'tdot';
      bubble.appendChild(dot);
    }
    body.appendChild(bubble);
    row.appendChild(body);
    chatEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function streamInto(row, delta) {
    var bubble = row.querySelector('.bubble');
    if (row.classList.contains('typing-row')) {
      row.classList.remove('typing-row');
      bubble.classList.remove('typing');
      bubble.textContent = '';
    }
    bubble.textContent += delta;
    scrollBottom();
  }

  function finalizeTyping(row, text) {
    var bubble = row.querySelector('.bubble');
    bubble.textContent = text;
    var body = row.querySelector('.msg-body');
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = fmtTime(Date.now());
    body.appendChild(meta);
    scrollBottom();
  }

  function removeRow(row) { if (row && row.parentNode) row.parentNode.removeChild(row); }

  function addErrorRow(message) {
    var row = document.createElement('div');
    row.className = 'msg-row bot';
    row.appendChild(avatarEl(true));
    var body = document.createElement('div');
    body.className = 'msg-body';

    var bubble = document.createElement('div');
    bubble.className = 'bubble error';
    bubble.textContent = '⚠️ ' + message;
    body.appendChild(bubble);

    var retry = document.createElement('button');
    retry.className = 'retry-btn';
    retry.textContent = '重试';
    retry.addEventListener('click', function () {
      removeRow(row);
      if (pendingRetry) startReply(pendingRetry.messages);
    });
    body.appendChild(retry);

    row.appendChild(body);
    chatEl.appendChild(row);
    scrollBottom();
  }

  /* ---------- API ---------- */
  function buildMessages() {
    return historyArr.slice(-MAX_CONTEXT).map(function (m) {
      return { role: m.role, content: m.content };
    });
  }

  function friendlyError(err) {
    if (err && err.name === 'AbortError') return '请求超时，请稍后重试';
    if (err && err.name === 'TypeError') return '无法连接服务器，请检查网络或稍后再试';
    return err && err.message ? err.message : '发送失败，请重试';
  }

  async function streamChat(messages, onDelta) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 120000);
    var res;
    try {
      res = await fetch('api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages }),
        signal: controller.signal
      });
    } catch (e) {
      clearTimeout(timer);
      throw new Error(friendlyError(e));
    }
    if (!res.ok) {
      clearTimeout(timer);
      var detail = '请求失败（' + res.status + '）';
      try {
        var j = await res.json();
        if (j && j.error) detail = j.error;
      } catch (e) {}
      throw new Error(detail);
    }
    try {
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var full = '';
      for (;;) {
        var r = await reader.read();
        if (r.done) break;
        buffer += decoder.decode(r.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.indexOf('data:') !== 0) continue;
          var data = line.slice(5).trim();
          if (data === '[DONE]') return full;
          try {
            var json = JSON.parse(data);
            var delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
            if (delta) { full += delta; onDelta(delta); }
          } catch (e) {}
        }
      }
      clearTimeout(timer);
      if (!full) throw new Error('AI 没有返回内容，请重试');
      return full;
    } catch (e) {
      clearTimeout(timer);
      throw new Error(friendlyError(e));
    }
  }

  /* ---------- send / reply ---------- */
  function updateSendUI() {
    sendBtn.disabled = streaming;
    sendBtn.setAttribute('aria-label', streaming ? '正在回复…' : '发送');
  }

  function sendMessage(text) {
    text = (text || '').trim();
    if (!text || streaming) return;
    historyArr.push({ id: uid(), role: 'user', content: text, ts: Date.now() });
    saveHistory();
    appendMessage({ role: 'user', content: text, ts: Date.now() });
    inputEl.value = '';
    updateQuickWrap();
    startReply(buildMessages());
  }

  function startReply(messages) {
    streaming = true;
    updateSendUI();
    updateQuickWrap();
    var typingRow = addTypingRow();
    pendingRetry = { messages: messages };
    streamChat(messages, function (delta) { streamInto(typingRow, delta); })
      .then(function (full) {
        finalizeTyping(typingRow, full);
        historyArr.push({ id: uid(), role: 'assistant', content: full, ts: Date.now() });
        saveHistory();
        pendingRetry = null;
        streaming = false;
        updateSendUI();
        updateQuickWrap();
      })
      .catch(function (err) {
        removeRow(typingRow);
        addErrorRow(err.message);
        streaming = false;
        updateSendUI();
        updateQuickWrap();
      });
  }

  /* ---------- menu sheet & clear chat ---------- */
  function openSheet() { sheetMask.classList.add('show'); sheet.classList.add('show'); }
  function closeSheet() { sheetMask.classList.remove('show'); sheet.classList.remove('show'); }

  var clearArmed = false;
  var clearTimer = null;
  function disarmClear() {
    clearArmed = false;
    var b = document.getElementById('clearChatBtn');
    b.textContent = '清空聊天记录';
    b.style.background = '';
    b.style.border = '';
  }
  function clearChat() {
    if (streaming) return;
    var btn = document.getElementById('clearChatBtn');
    if (!clearArmed) {
      clearArmed = true;
      btn.textContent = '再点一次确认清空';
      btn.style.background = '#fdecec';
      btn.style.border = '1px solid #f5c6cb';
      clearTimer = setTimeout(disarmClear, 3000);
      return;
    }
    clearTimeout(clearTimer);
    disarmClear();
    historyArr = [{ id: uid(), role: 'assistant', content: welcome, ts: Date.now() }];
    saveHistory();
    renderAll();
    closeSheet();
    toast('聊天记录已清空');
  }

  /* ---------- events ---------- */
  document.getElementById('backBtn').addEventListener('click', function () { toast('有问题直接问我吧～'); });
  document.getElementById('menuBtn').addEventListener('click', openSheet);
  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  sheetMask.addEventListener('click', closeSheet);
  document.getElementById('clearChatBtn').addEventListener('click', clearChat);
  document.getElementById('emojiBtn').addEventListener('click', function () { inputEl.focus(); });
  document.getElementById('cameraBtn').addEventListener('click', function () { toast('暂不支持发送图片'); });
  sendBtn.addEventListener('click', function () { sendMessage(inputEl.value); });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); sendMessage(inputEl.value); }
  });

  /* ---------- init ---------- */
  async function init() {
    // 从服务端拉取公共配置（失败时用内置默认值）
    try {
      var res = await fetch('api/config');
      if (res.ok) {
        var cfg = await res.json();
        if (cfg.botName) botName = cfg.botName;
        if (cfg.welcomeMessage) welcome = cfg.welcomeMessage;
        if (Array.isArray(cfg.quickQuestions) && cfg.quickQuestions.length) quickQuestions = cfg.quickQuestions;
      }
    } catch (e) {}
    historyArr = loadHistory();
    if (!historyArr) {
      historyArr = [{ id: uid(), role: 'assistant', content: welcome, ts: Date.now() }];
      saveHistory();
    }
    renderAll();
    inputEl.focus();
  }
  init();
})();
</script>
</body>
</html>
